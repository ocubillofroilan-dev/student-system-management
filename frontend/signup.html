<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Northbridge College</title>
<link rel="stylesheet" href="css/companion.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
</head>
<body class="bg-[#F5F6F8] text-ink font-body py-10">

<div class="max-w-2xl mx-auto px-4">
  <div class="bg-white border border-border rounded-xl shadow-lg p-8">

    <div class="text-center mb-6">
      <div class="font-display font-semibold text-navy-dark">
        Northbridge College
        <small class="block font-mono text-[0.62rem] tracking-[0.18em] text-muted uppercase">Student System Management</small>
      </div>
    </div>

    <h1 class="font-display text-xl font-semibold mb-1">Create Account</h1>
    <p class="text-muted text-sm mb-6">Choose your account type, then fill in your details.</p>

    <div id="signupError" class="hidden bg-[#FBE8E6] border border-[#F3C7C2] text-[#8A2E26] rounded-md px-3 py-2 mb-4 text-sm"></div>

    <form id="signupForm" novalidate class="space-y-4">

      <!-- Role toggle: radio inputs, visually styled as a segmented control -->
      <div>
        <label class="block text-sm font-semibold text-navy-dark mb-1">I am a</label>
        <div class="flex rounded-md overflow-hidden border border-navy">
          <input type="radio" name="role" id="roleStudent" value="student" checked class="peer/student hidden">
          <label for="roleStudent"
                 class="flex-1 text-center py-2 cursor-pointer text-navy peer-checked/student:bg-navy peer-checked/student:text-white transition">
            Student
          </label>

          <input type="radio" name="role" id="roleTeacher" value="teacher" class="peer/teacher hidden">
          <label for="roleTeacher"
                 class="flex-1 text-center py-2 cursor-pointer text-navy border-l border-navy peer-checked/teacher:bg-navy peer-checked/teacher:text-white transition">
            Teacher
          </label>
        </div>
      </div>

      <div class="grid md:grid-cols-3 gap-4">
        <div>
          <label for="firstName" class="block text-sm font-semibold text-navy-dark mb-1">First Name</label>
          <input type="text" id="firstName" required class="w-full border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
        </div>
        <div>
          <label for="lastName" class="block text-sm font-semibold text-navy-dark mb-1">Last Name</label>
          <input type="text" id="lastName" required class="w-full border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
        </div>
        <div>
          <label for="middleName" class="block text-sm font-semibold text-navy-dark mb-1">Middle Name</label>
          <input type="text" id="middleName" class="w-full border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
        </div>
      </div>

      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label for="idNumber" class="block text-sm font-semibold text-navy-dark mb-1">ID Number</label>
          <input type="text" id="idNumber" required placeholder="e.g. 2026-00123" class="w-full font-mono border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
        </div>
        <div>
          <label for="department" class="block text-sm font-semibold text-navy-dark mb-1">Department</label>
          <input type="text" id="department" required placeholder="e.g. College of Computing" class="w-full border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
        </div>
      </div>

      <!-- Student-only fields, hidden by auth.js when "Teacher" is selected -->
      <div id="studentFields" class="grid md:grid-cols-2 gap-4">
        <div>
          <label for="yearLevel" class="block text-sm font-semibold text-navy-dark mb-1">Year Level</label>
          <select id="yearLevel" class="w-full border border-border rounded-md px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
            <option value="">Choose…</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
            <option>5th Year</option>
          </select>
        </div>
        <div>
          <label for="course" class="block text-sm font-semibold text-navy-dark mb-1">Course / Program</label>
          <input type="text" id="course" placeholder="e.g. BS Computer Science" class="w-full border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
        </div>
      </div>

      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label for="signupPassword" class="block text-sm font-semibold text-navy-dark mb-1">Password</label>
          <input type="password" id="signupPassword" minlength="6" required class="w-full border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
        </div>
        <div>
          <label for="signupConfirmPassword" class="block text-sm font-semibold text-navy-dark mb-1">Confirm Password</label>
          <input type="password" id="signupConfirmPassword" minlength="6" required class="w-full border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
        </div>
      </div>

      <button type="submit" id="signupButton"
              class="w-full bg-navy text-white rounded-md py-2.5 font-semibold hover:bg-navy-dark transition disabled:opacity-60 mt-2">
        Create Account
      </button>
    </form>

    <p class="text-center text-sm mt-6">
      Already have an account? <a href="login.html" class="text-navy underline">Log in</a>
    </p>

  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
