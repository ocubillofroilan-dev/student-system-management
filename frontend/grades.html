<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grades — Northbridge College</title>
<link rel="stylesheet" href="css/companion.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
</head>
<body class="bg-[#F5F6F8] text-ink font-body">

<div id="navbar-slot"></div>

<main class="max-w-6xl mx-auto px-4 py-8">
  <h1 class="font-display text-xl font-semibold mb-1">Grades</h1>
  <p class="text-muted text-sm mb-6 student-only">Read-only — this is your personal grade record.</p>
  <p class="text-muted text-sm mb-6 teacher-only">Record a grade for any student, in any course.</p>

  <div class="grid lg:grid-cols-[2fr_1fr] gap-8">

    <div class="bg-white border border-border rounded-lg overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-navy-dark text-white">
          <tr class="font-mono text-xs uppercase tracking-wide">
            <th class="text-left px-4 py-3 font-medium teacher-only">Student</th>
            <th class="text-left px-4 py-3 font-medium">Code</th>
            <th class="text-left px-4 py-3 font-medium">Course</th>
            <th class="text-left px-4 py-3 font-medium">Period</th>
            <th class="text-left px-4 py-3 font-medium">Grade</th>
          </tr>
        </thead>
        <tbody id="gradesTableBody" class="divide-y divide-border">
          <tr><td colspan="5" class="text-center text-muted py-8">Loading grades…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="teacher-only">
      <div class="bg-white border border-border rounded-lg">
        <div class="border-b border-border px-4 py-3">
          <h2 class="font-display text-base font-semibold m-0">Record a Grade</h2>
        </div>
        <div class="p-4">
          <div id="gradeError" class="hidden bg-[#FBE8E6] border border-[#F3C7C2] text-[#8A2E26] rounded-md px-3 py-2 mb-3 text-sm"></div>
          <div id="gradeSuccess" class="hidden bg-[#E4F3EA] border border-[#BEE3CD] text-success rounded-md px-3 py-2 mb-3 text-sm"></div>
          <form id="gradeForm" class="space-y-3">
            <div>
              <label for="gradeStudent" class="block text-sm font-semibold text-navy-dark mb-1">Student</label>
              <select id="gradeStudent" required class="w-full border border-border rounded-md px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold"></select>
            </div>
            <div>
              <label for="gradeCourse" class="block text-sm font-semibold text-navy-dark mb-1">Course</label>
              <select id="gradeCourse" required class="w-full border border-border rounded-md px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold"></select>
            </div>
            <div>
              <label for="gradePeriod" class="block text-sm font-semibold text-navy-dark mb-1">Grading Period</label>
              <select id="gradePeriod" required class="w-full border border-border rounded-md px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
                <option>Prelim</option>
                <option>Midterm</option>
                <option>Finals</option>
              </select>
            </div>
            <div>
              <label for="gradeValue" class="block text-sm font-semibold text-navy-dark mb-1">Grade</label>
              <input type="text" id="gradeValue" placeholder="e.g. 1.75 or 92" required class="w-full font-mono border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
            </div>
            <button type="submit" class="w-full bg-gold text-navy-dark font-semibold rounded-md py-2 hover:bg-gold-light transition">Save Grade</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="border-t border-border py-6 mt-4">
  <div class="max-w-6xl mx-auto px-4 text-center text-sm text-muted">&copy; 2026 Northbridge College — Student System Management</div>
</footer>

<script src="js/api.js"></script>
<script src="js/navbar.js"></script>
<script src="js/guard.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
