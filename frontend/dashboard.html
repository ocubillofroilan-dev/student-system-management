<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Enchong Dee University</title>
<link rel="stylesheet" href="css/companion.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
</head>
<body class="bg-[#FAF6EC] text-ink font-body">

<div id="navbar-slot"></div>

<main class="max-w-6xl mx-auto px-4 py-8">

  <div class="bg-white border border-border border-l-4 border-l-gold rounded-lg p-6 mb-8">
    <div class="font-mono text-xs uppercase tracking-wide text-gold">Welcome to</div>
    <h1 class="font-display text-2xl font-semibold mb-1">Enchong Dee University!</h1>
    <p class="mb-0 text-muted">Hello, <strong data-user-name></strong> — glad to see you back.</p>
  </div>

  <div class="max-w-2xl mx-auto">

    <!-- Composer (professors only) -->
    <div class="teacher-only">
      <div class="bg-white border border-border rounded-lg p-4 mb-5 flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-navy text-white flex items-center justify-center text-sm font-semibold flex-shrink-0" data-user-initials>—</div>
        <button type="button" id="openComposer" class="flex-1 text-left bg-[#FAF6EC] hover:bg-[#F1EBDA] border border-border rounded-full px-4 py-2 text-sm text-muted transition">
          What's on your mind?
        </button>
        <button type="button" id="openComposerMedia" class="text-sm font-semibold text-navy hover:text-gold transition whitespace-nowrap">📷 Photo / Video</button>
      </div>
    </div>

    <h2 class="font-display text-lg font-semibold mb-3">Announcements</h2>
    <div id="dashAnnouncements" class="space-y-4 mb-8">
      <div class="bg-white border border-border rounded-lg text-center text-muted py-8">Loading announcements…</div>
    </div>
  </div>
</main>

<footer class="border-t border-border py-6 mt-4">
  <div class="max-w-6xl mx-auto px-4 text-center text-sm text-muted">&copy; 2026 Enchong Dee University — Student System Management</div>
</footer>

<!-- ===== Create / Edit post window ===== -->
<div id="postModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-xl w-full max-w-lg max-h-[90vh] flex flex-col border-t-4 border-gold shadow-xl">
    <div class="flex items-center justify-between px-5 py-3 border-b border-border">
      <h2 id="postModalTitle" class="font-display font-semibold">Create post</h2>
      <button type="button" id="btnClosePostModal" class="text-muted hover:text-ink text-2xl leading-none" aria-label="Close">&times;</button>
    </div>

    <form id="postForm" class="flex flex-col flex-1 min-h-0">
      <div class="px-5 py-4 overflow-y-auto space-y-3">
        <div id="postError" class="hidden bg-[#FBE8E6] border border-[#F3C7C2] text-[#8A2E26] rounded-md px-3 py-2 text-sm"></div>

        <input type="text" id="postTitle" placeholder="Title (optional)" maxlength="120"
               class="w-full border border-border rounded-md px-3 py-2 font-semibold focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
        <textarea id="postBody" rows="5" placeholder="What's on your mind?"
                  class="w-full border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold"></textarea>

        <div id="postMediaPreview" class="hidden relative rounded-lg overflow-hidden border border-border"></div>

        <div class="flex items-center justify-between border border-border rounded-lg px-3 py-2">
          <span class="text-sm text-muted">Add to your post</span>
          <button type="button" id="btnPickMedia" class="text-sm font-semibold text-navy hover:text-gold transition">📷 Photo / Video</button>
        </div>
        <input type="file" id="postFile" class="hidden"
               accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime">
      </div>

      <div class="px-5 py-3 border-t border-border">
        <button type="submit" id="postSubmit" class="w-full bg-gold text-navy-dark font-semibold rounded-md py-2 hover:bg-gold-light transition disabled:opacity-60">Post</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/navbar.js"></script>
<script src="js/guard.js"></script>
<script src="js/modal.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
