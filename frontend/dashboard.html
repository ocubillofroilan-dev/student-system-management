<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Northbridge College</title>
<link rel="stylesheet" href="css/companion.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
</head>
<body class="bg-[#F5F6F8] text-ink font-body">

<div id="navbar-slot"></div>

<main class="max-w-6xl mx-auto px-4 py-8">

  <div class="bg-white border border-border border-l-4 border-l-gold rounded-lg p-6 mb-8">
    <div class="font-mono text-xs uppercase tracking-wide text-gold">Welcome to</div>
    <h1 class="font-display text-2xl font-semibold mb-1">Northbridge College!</h1>
    <p class="mb-0 text-muted">Hello, <strong data-user-name></strong> — glad to see you back.</p>
  </div>

  <div class="grid lg:grid-cols-[2fr_1fr] gap-8">
    <div>
      <h2 class="font-display text-lg font-semibold mb-3">Announcements</h2>
      <div id="dashAnnouncements" class="bg-white border border-border rounded-lg divide-y divide-border mb-6">
        <div class="text-center text-muted py-8">Loading announcements…</div>
      </div>
    </div>

    <div class="teacher-only">
      <div class="bg-white border border-border rounded-lg">
        <div class="border-b border-border px-4 py-3">
          <h2 class="font-display text-base font-semibold m-0">Post an Announcement</h2>
        </div>
        <div class="p-4">
          <div id="annError" class="hidden bg-[#FBE8E6] border border-[#F3C7C2] text-[#8A2E26] rounded-md px-3 py-2 mb-3 text-sm"></div>
          <form id="postAnnouncementForm" class="space-y-3">
            <div>
              <label for="annTitle" class="block text-sm font-semibold text-navy-dark mb-1">Title</label>
              <input type="text" id="annTitle" required class="w-full border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
            </div>
            <div>
              <label for="annBody" class="block text-sm font-semibold text-navy-dark mb-1">Message</label>
              <textarea id="annBody" rows="4" required class="w-full border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold"></textarea>
            </div>
            <button type="submit" class="w-full bg-gold text-navy-dark font-semibold rounded-md py-2 hover:bg-gold-light transition">Post</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="border-t border-border py-6 mt-4">
  <div class="max-w-6xl mx-auto px-4 text-center text-sm text-muted">&copy; 2026 Northbridge College — Student System Management</div>
</footer>

<script src="js/api.js"></script>
<script src="js/navbar.js"></script>
<script src="js/guard.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
