<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses — Northbridge College</title>
<link rel="stylesheet" href="css/companion.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
</head>
<body class="bg-[#F5F6F8] text-ink font-body">

<div id="navbar-slot"></div>

<main class="max-w-6xl mx-auto px-4 py-8">
  <h1 class="font-display text-xl font-semibold mb-1">Courses</h1>
  <p class="text-muted text-sm mb-6 student-only">Read-only — your teacher manages the course catalog.</p>
  <p class="text-muted text-sm mb-6 teacher-only">Add, edit, or remove courses in the catalog below.</p>

  <div class="grid lg:grid-cols-[2fr_1fr] gap-8">

    <div class="bg-white border border-border rounded-lg overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-navy-dark text-white">
          <tr class="font-mono text-xs uppercase tracking-wide">
            <th class="text-left px-4 py-3 font-medium">Code</th>
            <th class="text-left px-4 py-3 font-medium">Title</th>
            <th class="text-left px-4 py-3 font-medium">Department</th>
            <th class="text-left px-4 py-3 font-medium">Units</th>
            <th class="text-left px-4 py-3 font-medium">Description</th>
            <th class="text-right px-4 py-3 font-medium teacher-only">Actions</th>
          </tr>
        </thead>
        <tbody id="courseTableBody" class="divide-y divide-border">
          <tr><td colspan="6" class="text-center text-muted py-8">Loading courses…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="teacher-only">
      <div class="bg-white border border-border rounded-lg">
        <div class="border-b border-border px-4 py-3">
          <h2 class="font-display text-base font-semibold m-0" id="courseFormTitle">Add Course</h2>
        </div>
        <div class="p-4">
          <div id="courseError" class="hidden bg-[#FBE8E6] border border-[#F3C7C2] text-[#8A2E26] rounded-md px-3 py-2 mb-3 text-sm"></div>
          <form id="courseForm" class="space-y-3">
            <div>
              <label for="courseCode" class="block text-sm font-semibold text-navy-dark mb-1">Code</label>
              <input type="text" id="courseCode" placeholder="e.g. CS101" required class="w-full border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
            </div>
            <div>
              <label for="courseTitle" class="block text-sm font-semibold text-navy-dark mb-1">Title</label>
              <input type="text" id="courseTitle" required class="w-full border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
            </div>
            <div>
              <label for="courseDepartment" class="block text-sm font-semibold text-navy-dark mb-1">Department</label>
              <input type="text" id="courseDepartment" class="w-full border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
            </div>
            <div>
              <label for="courseUnits" class="block text-sm font-semibold text-navy-dark mb-1">Units</label>
              <input type="number" id="courseUnits" value="3" min="0" max="10" class="w-full border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold">
            </div>
            <div>
              <label for="courseDescription" class="block text-sm font-semibold text-navy-dark mb-1">Description</label>
              <textarea id="courseDescription" rows="3" class="w-full border border-border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold"></textarea>
            </div>
            <div class="flex gap-2">
              <button type="submit" class="flex-1 bg-gold text-navy-dark font-semibold rounded-md py-2 hover:bg-gold-light transition">Save</button>
              <button type="button" id="courseCancelEdit" class="hidden border border-muted text-muted rounded-md px-4 hover:bg-muted hover:text-white transition">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="border-t border-border py-6 mt-4">
  <div class="max-w-6xl mx-auto px-4 text-center text-sm text-muted">&copy; 2026 Northbridge College — Student System Management</div>
</footer>

<script src="js/api.js"></script>
<script src="js/navbar.js"></script>
<script src="js/guard.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
